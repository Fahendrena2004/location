<div th:fragment="sidebar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="sidebar-main" id="sidebar">

        <!-- Logo -->
        <div class="sidebar-logo">
            <div class="logo-icon">
                <i class="bi bi-car-front-fill"></i>
            </div>
            <div class="logo-text">
                <p class="brand-name">AUTORENT</p>
                <span class="brand-tag">★ Premium</span>
            </div>
        </div>

        <!-- Menu -->
        <div class="sidebar-menu">

            <!-- GÉNÉRAL -->
            <div class="sidebar-section-label">Général</div>

            <a href="/dashboard" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI == '/dashboard' ? ' active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Tableau de bord</span>
            </a>

            <a href="/profile" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/profile') ? ' active' : ''}">
                <i class="bi bi-person-badge"></i>
                <span>Mon Profil</span>
            </a>

            <a href="/notifications" class="sidebar-link d-flex align-items-center justify-content-between"
               th:classappend="${requestURI != null and requestURI.startsWith('/notifications') ? ' active' : ''}">
                <div class="d-flex align-items-center gap-3">
                    <i class="bi bi-bell-fill"></i>
                    <span>Notifications</span>
                </div>
                <span class="badge-dot" th:if="${unreadNotificationsCount > 0}" th:text="${unreadNotificationsCount}"></span>
            </a>

            <!-- OPÉRATIONS -->
            <div class="sidebar-section-label mt-2">Opérations</div>

            <a href="/voitures" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/voitures') ? ' active' : ''}">
                <i class="bi bi-car-front-fill"></i>
                <span>Flotte Véhicules</span>
            </a>

            <a href="/locations" class="sidebar-link"
               th:classappend="${requestURI != null and (requestURI.startsWith('/locations') and !requestURI.contains('calendrier')) ? ' active' : ''}">
                <i class="bi bi-calendar-check-fill"></i>
                <span>Réservations</span>
            </a>

            <a href="/locations/calendrier" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI.contains('calendrier') ? ' active' : ''}">
                <i class="bi bi-calendar3-range"></i>
                <span>Planning</span>
            </a>

            <a href="/paiements" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/paiements') ? ' active' : ''}">
                <i class="bi bi-credit-card-2-back-fill"></i>
                <span>Finances</span>
            </a>

            <a href="/factures" class="sidebar-link"
               th:classappend="${requestURI != null and requestURI.startsWith('/factures') ? ' active' : ''}">
                <i class="bi bi-file-earmark-text-fill"></i>
                <span>Facturation</span>
            </a>

            <!-- ADMINISTRATION -->
            <div sec:authorize="hasRole('ADMIN')">
                <div class="sidebar-section-label mt-2">Administration</div>

                <a href="/clients" class="sidebar-link"
                   th:classappend="${requestURI != null and requestURI.startsWith('/clients') ? ' active' : ''}">
                    <i class="bi bi-people-fill"></i>
                    <span>Gestion Clients</span>
                </a>

                <a href="/entretien" class="sidebar-link"
                   th:classappend="${requestURI != null and requestURI.startsWith('/entretien') ? ' active' : ''}">
                    <i class="bi bi-tools"></i>
                    <span>Maintenance</span>
                </a>

                <a href="/users" class="sidebar-link"
                   th:classappend="${requestURI != null and requestURI.startsWith('/users') ? ' active' : ''}">
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Accès &amp; Sécurité</span>
                </a>

                <a href="/parametres" class="sidebar-link"
                   th:classappend="${requestURI != null and requestURI.startsWith('/parametres') ? ' active' : ''}">
                    <i class="bi bi-gear-fill"></i>
                    <span>Paramètres</span>
                </a>
            </div>
        </div>

        <!-- Bottom: Currency + Logout -->
        <div class="sidebar-bottom">
            <!-- Currency Toggle -->
            <div class="currency-glass">
                <input type="radio" name="currencyToggle" id="currMGA" value="MGA" class="btn-check" checked>
                <label class="currency-btn" for="currMGA">MGA</label>
                <input type="radio" name="currencyToggle" id="currEUR" value="EUR" class="btn-check">
                <label class="currency-btn" for="currEUR">EUR</label>
            </div>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-logout">
                    <span>Se déconnecter</span>
                    <i class="bi bi-power"></i>
                </button>
            </form>
        </div>

    </div>
</div>
