<div th:fragment="top-navbar" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="top-navbar">
        <!-- Left: Hamburger + Breadcrumb -->
        <div class="d-flex align-items-center gap-3">
            <button class="btn-nav-icon sidebar-toggle-btn" id="sidebarToggle" type="button" title="Toggle menu">
                <i class="bi bi-list fs-4"></i>
            </button>
            <nav class="nav-breadcrumb-path d-flex align-items-center gap-2">
                <a href="/dashboard" class="text-muted" title="Accueil">
                    <i class="bi bi-house fs-6"></i>
                </a>
                <span class="text-muted">/</span>
                <span class="fw-semibold text-main small" th:text="${titrePage} ?: 'Accueil'">Accueil</span>
            </nav>
        </div>

        <!-- Right: Actions -->
        <div class="d-flex align-items-center gap-2">

            <!-- Currency Toggle (dark pill style) -->
            <div class="currency-pill-toggle">
                <input type="radio" name="currencyToggle" id="navMGA" value="MGA" class="btn-check">
                <label class="currency-pill-btn" for="navMGA">Ar</label>
                <input type="radio" name="currencyToggle" id="navEUR" value="EUR" class="btn-check">
                <label class="currency-pill-btn" for="navEUR">€</label>
            </div>

            <!-- Chevron (collapse/info button) -->
            <button class="btn-nav-icon sidebar-toggle-btn" type="button" title="Réduire">
                <i class="bi bi-chevron-left small"></i>
            </button>

            <!-- Notifications Bell -->
            <div class="dropdown">
                <button class="btn-nav-icon" type="button" data-bs-toggle="dropdown" id="notifDropdown">
                    <i class="bi bi-bell fs-6"></i>
                    <span class="notif-dot" th:if="${unreadNotificationsCount > 0}"></span>
                </button>
                <div class="dropdown-menu dropdown-menu-end shadow border-0 p-2 mt-1" style="min-width:280px; border-radius:12px;">
                    <h6 class="px-3 py-1 text-muted x-small text-uppercase fw-bold mb-1">Notifications</h6>
                    <div th:each="n : ${recentNotifications}">
                        <a class="dropdown-item rounded-3 py-2 small" th:href="@{/notifications}"
                           th:text="${n.titre}">Notification</a>
                    </div>
                    <div th:if="${recentNotifications == null or #lists.isEmpty(recentNotifications)}"
                         class="text-center text-muted small py-3">
                        Aucune notification
                    </div>
                    <div class="border-top mt-1 pt-1">
                        <a href="/notifications" class="dropdown-item rounded-3 text-center text-primary small fw-bold">
                            Voir tout
                        </a>
                    </div>
                </div>
            </div>

            <!-- Settings Gear -->
            <a href="/parametres" class="btn-nav-icon" title="Paramètres">
                <i class="bi bi-gear fs-6"></i>
            </a>

            <!-- User Avatar -->
            <div class="dropdown">
                <button class="nav-avatar-btn" type="button" data-bs-toggle="dropdown" title="Mon compte">
                    <span th:text="${#authentication != null ? #strings.substring(#authentication.name, 0, 1).toUpperCase() : 'U'}">U</span>
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 p-2 mt-1" style="border-radius:12px; min-width:200px;">
                    <li class="px-3 py-2 border-bottom mb-1">
                        <div class="small fw-bold text-main" sec:authentication="principal.username">admin</div>
                        <div class="x-small text-muted" sec:authentication="principal.authorities[0].authority">ROLE_ADMIN</div>
                    </li>
                    <li><a class="dropdown-item rounded-3 py-2 small" href="/profile"><i class="bi bi-person me-2"></i>Mon Profil</a></li>
                    <li><a class="dropdown-item rounded-3 py-2 small" href="/parametres"><i class="bi bi-gear me-2"></i>Paramètres</a></li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item rounded-3 py-2 small text-danger fw-bold">
                                <i class="bi bi-power me-2"></i>Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
