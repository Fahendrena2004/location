<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Paramètres</title>
</head>
<body>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content-layout" id="mainContent">
        <div th:replace="~{fragments/top_navbar :: top-navbar}"></div>

        <main class="page-container">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0"><i class="bi bi-gear-fill text-primary me-2"></i> Paramètres Système</h1>
            </div>

            <div th:if="${message}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${message}">Message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-header bg-transparent border-0 pt-4 px-4">
                            <h5 class="mb-0 fw-bold">Configuration Financière</h5>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/parametres/update-rate}" method="post">
                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Taux de change (1 EUR = ? Ar)</label>
                                    <div class="input-group input-group-lg">
                                        <input type="number" name="rate" class="form-control" th:value="${exchangeRateEur}" step="0.01" required>
                                        <span class="input-group-text bg-light">Ar</span>
                                    </div>
                                    <div class="form-text mt-2 text-muted">
                                        <i class="bi bi-info-circle me-1"></i>
                                        Ce taux impacte tous les prix convertis en temps réel.
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary px-4 py-2">
                                    <i class="bi bi-save me-2"></i>Mettre Ã  jour le taux
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card h-100 border-0 shadow-sm">
                        <div class="card-header bg-transparent border-0 pt-4 px-4">
                            <h5 class="mb-0 fw-bold">Informations Entreprise</h5>
                        </div>
                        <div class="card-body p-4">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Nom commercial</label>
                                    <input type="text" class="form-control" value="AUTORENT Madagascar">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email de contact</label>
                                    <input type="email" class="form-control" value="contact@autorent.mg">
                                </div>
                                <button type="submit" class="btn btn-outline-primary px-4">Enregistrer</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
